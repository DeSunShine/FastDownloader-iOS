name: FastDownloader
options:
  bundleIdPrefix: com.desunshine
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
targets:
  FastDownloader:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - FastDownloader
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.desunshine.fastdownloader
        INFOPLIST_FILE: FastDownloader/Info.plist
        CURRENT_PROJECT_VERSION: 3
        MARKETING_VERSION: 0.2.1
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: "NO"
  FastDownloaderTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - FastDownloaderTests
    dependencies:
      - target: FastDownloader
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
schemes:
  FastDownloader:
    build:
      targets:
        FastDownloader: all
    test:
      gatherCoverageData: true
      targets:
        - name: FastDownloaderTests
